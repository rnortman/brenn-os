# The supplicant reads the provisioned configuration and nothing else. Network
# name, passphrase and regulatory domain are all in that one file, published at
# the runtime path after the generation for this boot has been chosen.
#
# The condition is the degraded case: a device with no configuration comes up
# without wireless and says so, rather than failing a service or, worse,
# associating with something it invented.
#
# It restarts forever. A supplicant that has exited is a device off the
# network, and there is no state in which giving up is better than trying
# again in five seconds.

[Unit]
After=brenn-config-select.service
ConditionPathExists=/run/brenn/provisioning/net/wpa_supplicant-wlan0.conf
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c /run/brenn/provisioning/net/wpa_supplicant-wlan0.conf -i wlan0 -D nl80211,wext
Restart=always
RestartSec=5s
