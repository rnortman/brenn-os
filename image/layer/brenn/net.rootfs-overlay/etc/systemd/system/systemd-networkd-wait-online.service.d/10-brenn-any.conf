# One link online is online. The default waits for every managed link, which on
# a device that is on wireless in the field and on a cable at a bench means
# waiting out the timeout for whichever one is not connected — and this wait
# succeeding is what a healthy boot is judged on.
#
# The other side of --any: a cable satisfies it on its own. A bench device with
# a wired link is online whatever its wireless credentials say, so a trial that
# is meant to fail on bad credentials has to be run without one.

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=90
