# The device answers exactly one kind of question: which address it is at. Its
# provisioned name over multicast DNS, and the reverse lookup of its own
# addresses, which the responder answers as a pair. It advertises no service and
# answers for nothing but itself. On a network the operator does not control the
# lease table is somebody else's admin page, so the name is the only handle
# there is.
#
# Link-local name resolution stays off: it solves the same problem worse, and
# one discovery mechanism is the whole of the surface that was meant to open.
#
# The responder has no answer-only mode, so this also makes the device query
# multicast DNS when it resolves a .local name. That is resolver behaviour and
# not a listener, and this image resolves almost nothing by name.

[Resolve]
LLMNR=no
MulticastDNS=yes
