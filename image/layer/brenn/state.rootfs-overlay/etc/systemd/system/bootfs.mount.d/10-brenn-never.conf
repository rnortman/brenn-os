# The tryboot selector partition is mounted only for the moment it takes to
# switch slots, by the code that switches them, so the fstab entry mounting it
# read-write at boot never runs.
#
# This entry does carry nofail, which makes it a Wants of local-fs.target rather
# than a Requires, so masking it would have been harmless. It is neutralised the
# same way as the two bind mounts anyway: one mechanism for all three is one
# thing to understand, and a builder bump that dropped nofail here would
# otherwise turn a harmless mask into a silently dropped local-fs.target — see
# state.yaml, in this layer.
#
# Read the condition the way systemd does: creating the file below is what makes
# this mount RUN. Nothing may ever put it on the image or on a device.
[Unit]
ConditionPathExists=/etc/brenn/never-mount
