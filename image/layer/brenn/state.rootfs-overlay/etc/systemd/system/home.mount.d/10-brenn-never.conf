# No account has a home on persistent storage, so the bind mount the A/B
# layout's fstab asks for never runs.
#
# Held back by a condition that cannot be met, and deliberately not by a mask:
# masking this unit costs the whole local-fs.target start job, silently. The
# mechanism is in state.yaml, in this layer.
#
# Read the condition the way systemd does: creating the file below is what makes
# this mount RUN. Nothing may ever put it on the image or on a device.
[Unit]
ConditionPathExists=/etc/brenn/never-mount
