# The persistent partition is the only writable storage on the device, and
# everything that keeps state between boots is on it.
#
# The A/B image layout mounts it from a generator but leaves it to be pulled in
# by the fstab entries that bind /home and the journal onto it — both of which
# this product masks. Requiring it by path here does not depend on which unit
# provides the mount, only that one does.
[Unit]
RequiresMountsFor=/persistent
