# The journal lives in RAM and leaves the device over the network. A log
# stored on the eMMC would be a write on every boot for a copy nobody reads.
#
# The filename sorts last on purpose: the A/B image layout ships its own
# drop-in selecting persistent storage, and drop-ins are merged in filename
# order. The image suite asserts the merge still resolves to volatile.
[Journal]
Storage=volatile
Compress=yes

# Bound on the RAM the journal may hold when the collector is unreachable.
RuntimeMaxUse=64M
RuntimeMaxFileSize=8M

# Retention is the collector's job; here, space is the only limit.
MaxRetentionSec=0
MaxFileSec=0

# Sealing protects an at-rest journal against tampering. Nothing is at rest.
Seal=no

ForwardToSyslog=no
