# brenn-os sshd policy.
#
# sshd takes the first value it obtains for a keyword and ignores every later
# one, and the packaged configuration includes this directory before it sets
# anything, so what is written here wins over the distribution's defaults. The
# file is named to sort first for the same reason.

# Keys, and nothing else. No account in the image has a password, so password
# authentication cannot succeed today; refusing it explicitly means that adding
# an account later cannot quietly open a second way in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey

# TODO(unprivileged-admin): administration is done as root over a key-only
# channel. An unprivileged administrator with a policy for what it may escalate
# to is the hardening step; while there is no password anywhere and no other
# account with a shell, it is hygiene rather than a boundary.
PermitRootLogin prohibit-password
AllowUsers root

# Host identity and the access list come from the generation selected for this
# boot, so both survive a reflash and neither is in the image. Naming the host
# key explicitly also means only this one is offered: the others do not exist.
HostKey /run/brenn/provisioning/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /run/brenn/provisioning/ssh/authorized_keys

# There is no interactive user and nothing on the device proxies for anything
# else, so the parts of ssh that exist to carry other traffic are off.
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
PrintMotd no
