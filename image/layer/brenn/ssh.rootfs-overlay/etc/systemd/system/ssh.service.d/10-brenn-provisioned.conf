# sshd runs on a provisioned device and on no other. Its host key and its
# access list both come from the generation selected for this boot: without the
# key there is nothing for a client to recognise, and without the access list
# there is nobody to admit.
#
# So an unprovisioned device does not listen. That is the intended outcome —
# the alternative is a device that invents a host identity, accepts nobody, and
# looks configured from outside.

[Unit]
After=brenn-config-select.service
ConditionPathExists=/run/brenn/provisioning/ssh/ssh_host_ed25519_key
ConditionPathExists=/run/brenn/provisioning/ssh/authorized_keys
