# Where an update is staged and where its outcome is recorded, on the one
# writable partition. Both are root-only: a bundle waiting to be installed and
# the record of which slot is trusted are as sensitive as the update mechanism
# itself.
#
# Written as the partition's own path rather than as /data, which is a symlink
# to it — these lines create directories, and a directory is created where the
# path really leads.
d /persistent/rauc 0700 root root -
d /persistent/updates 0700 root root -
