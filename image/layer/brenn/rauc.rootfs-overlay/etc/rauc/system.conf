# The A/B update system.
#
# Two pairs, each a boot partition and a system partition, addressed by GPT
# label: both slots ship byte-identical, so a filesystem UUID identifies
# neither. The boot half is a child of the system half, so one bundle updates
# the kernel, the firmware and the root filesystem of a slot together and the
# firmware flips to all of it at once.
#
# Slot selection is the firmware's tryboot mechanism, driven by the backend
# below — no released RAUC speaks tryboot natively.
#
# TODO(native-tryboot-backend): adopt the upstream backend when it ships.

[system]
compatible=brenn-os/cm4
bootloader=custom
bundle-formats=verity
statusfile=/data/rauc/status.ini

# Bundles are verified against a keyring that arrives with the provisioning
# generation, through the path that generation is published at. The image
# carries no certificate of its own, and a device that was never provisioned
# can verify nothing and therefore installs nothing.
[keyring]
path=/run/brenn/provisioning/rauc/keyring.pem

[handlers]
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot-backend

# Called before anything is written, and able to stop the installation. It is
# what keeps an update and a configuration change from being on trial at once,
# which would leave a failed boot with two candidates to blame.
pre-install=/usr/lib/brenn/brenn-rauc-preinstall

[slot.rootfs.0]
device=/dev/disk/by-partlabel/system_a
type=ext4
bootname=A

[slot.boot.0]
device=/dev/disk/by-partlabel/boot_a
type=vfat
parent=rootfs.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/system_b
type=ext4
bootname=B

[slot.boot.1]
device=/dev/disk/by-partlabel/boot_b
type=vfat
parent=rootfs.1
