[Unit]
# The keyring every bundle is judged against comes from the selected
# provisioning generation, so the service must not be activated before the
# selection has been published. It is activated on demand, long after this
# point in the boot; the ordering is here so that the dependency is a fact of
# the system rather than a property of when somebody happens to run an
# install.
#
# No condition on the keyring itself: unlike sshd, this service exposes
# nothing and holds no identity, and an unprovisioned device that is asked to
# install a bundle should say it cannot verify it rather than say nothing at
# all.
After=brenn-config-select.service
