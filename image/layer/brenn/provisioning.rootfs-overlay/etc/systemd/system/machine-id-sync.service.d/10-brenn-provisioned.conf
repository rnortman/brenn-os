# The machine id is part of a unit's provisioning, so that logs from one
# device stay one device's logs across a reflash. The A/B layout's own sync
# instead copies whatever id the first boot generated to and from the writable
# partition, which both loses that property and writes to flash. Its unit is
# created during image assembly and cannot be removed from here, so its work is
# emptied out and brenn-config-select.service does the job from the provisioned
# generation.
[Unit]
After=brenn-config-select.service

[Service]
ExecStart=
ExecStart=/bin/true
