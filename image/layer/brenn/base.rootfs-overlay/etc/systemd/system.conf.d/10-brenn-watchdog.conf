# The hardware watchdog, armed. A device that has wedged has to become a device
# that has reset: nobody is going to walk over and power-cycle it, and a trial
# boot that hangs only returns to the previous system if something resets the
# board.
#
# Fifteen seconds is at the top of what this watchdog counts to; the kernel
# clamps anything longer, and systemd pets it at half the interval.

[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=2min
