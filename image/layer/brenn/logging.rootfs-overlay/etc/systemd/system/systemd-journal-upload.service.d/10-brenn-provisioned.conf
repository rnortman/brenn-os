# The uploader opens a TLS connection to the collector, which means it needs
# both a network and a clock: a device that has just been powered on believes
# it is 1970 and will reject every certificate it is shown. The ordering is
# restated here rather than inherited so that an upstream change to the
# packaged unit cannot quietly remove it.
#
# Its configuration — the collector's address and the trust anchor — is the
# provisioned file, so a device without one does not try.
#
# It never stops trying. An unreachable collector is a bounded buffer in RAM
# and a service that reconnects, not a service that has given up: the retry
# interval grows to a ceiling on its own, and no start limit is allowed to
# convert a long outage into a permanent failure.

[Unit]
Wants=network-online.target
After=network-online.target time-sync.target
ConditionPathExists=/run/brenn/provisioning/journal/upload.conf
StartLimitIntervalSec=0
