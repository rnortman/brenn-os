# The application's directories, on both sides of the flash boundary.
#
# In RAM, under the capped mount: where payloads are unpacked, and the one
# writable scratch area the payload itself is given. Only the scratch belongs
# to the application account — a payload is immutable once it is activated,
# and nothing that runs it may rewrite it.
d /run/brenn-app/releases 0755 root root -
d /run/brenn-app/scratch 0700 app app -

# On the persistent partition: the rare asset a payload wants to survive a
# reboot, and somewhere to park a model too large to hold in memory alongside
# everything else. Both are writes to flash and both are meant to be rare;
# they exist so that the choice is deliberate rather than absent.
#
# Written as the partition's own path rather than as /data, which is a symlink
# to it — these lines create directories, and a directory is created where the
# path really leads.
d /persistent/app 0755 app app -
d /persistent/models 0755 app app -
