name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# All jobs only read the tree. Pinned here so a permissive repo-level default
# cannot silently hand a write-capable token to cached actions, the downloaded
# scanner, or anything `make check` executes.
permissions:
  contents: read

jobs:
  # Named for its role, not its contents. The required-status-check rule embeds
  # this string, so a rename to track what the gate currently runs would leave
  # the rule pointing at a job that no longer exists — and silently stop gating.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # The builder submodule is fetched so the layer-metadata lint runs for
      # real. `make check` skips that lint when the submodule is absent, which
      # is a convenience on a fresh clone and must never be CI's path.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # python3-debian: the builder's metadata linter parses deb822, and without
      # it the lint skips — a skipping gate is a green result that checked
      # nothing.
      #
      # rauc and squashfs-tools: the host lane packs and verifies an update
      # bundle of a few kilobytes on every push, which is the only cheap place
      # the signing path runs at all — the image lane's round trip is behind a
      # half-hour build. This is the tool that packs a bundle, not the one that
      # installs it: the version that matters on a device is pinned into the
      # image.
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-debian rauc squashfs-tools

      # ubuntu-latest preinstalls shellcheck, but its version drifts with the
      # runner image, so a tree that lints clean on a developer's machine can go
      # red in CI on a rule an older version emits (and vice versa). Pin it —
      # same discipline as the scrub job's scanner — so the gate is reproducible
      # against a version a developer can install. The sha256 is the real gate
      # (release assets are mutable); the version check is a secondary sanity
      # line.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf shellcheck.tar.xz -O "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" > "$RUNNER_TEMP/bin/shellcheck"
          chmod +x "$RUNNER_TEMP/bin/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The host lane's cases that install a provisioning generation need uid
      # 0, and take it from a user namespace rather than from the job. Without
      # one they are not run and the lane says so — a gate quietly checking
      # less than it reports. Asserted here so a runner policy that refuses
      # unprivileged namespaces is a red job rather than a thinner one.
      - name: Assert unprivileged user namespaces are available
        run: unshare -r true

      # The gate's contents live in the root `check` target, not here, so the
      # whole thing is reproducible locally on a fresh clone. `check` skips the
      # lint when shellcheck is absent; the step above is what makes that
      # impossible here.
      - run: make check

  # Whether there is anything for the image lane to do. Building an image takes
  # tens of minutes on a runner, so a pull request that cannot affect one does
  # not start a build; anything landing on the default branch does, because that
  # is the tree releases are cut from.
  image-scope:
    name: image-scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      # Full history: the decision is a diff against the base of the pull
      # request, which a shallow clone does not contain. Only a pull request
      # needs it — the step below answers a push without looking at the tree at
      # all, and cloning the whole history to not read it gets slower with every
      # commit that lands.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "not a pull request — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything the build reads: the image sources, the scripts that
          # drive it, the assertions made against it, the lanes themselves, and
          # the builder's own pinned commit.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            grep -E '^(image|scripts|tests|\.github)/|^(Makefile|rpi-image-gen|\.gitmodules)$' || true)
          if [ -n "$changed" ]; then
            echo "building — changed:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the image build reads has changed"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Not a required status check until it has a record of being stable — a lane
  # that blocks merges before it is trusted gets routed around, which is worse
  # than not having it.
  image:
    name: image
    needs: image-scope
    if: needs.image-scope.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The rootfs is assembled in an unprivileged user namespace that must be
      # able to traverse into the runner's home directory.
      - name: Install builder host dependencies
        working-directory: rpi-image-gen
        run: |
          sudo apt-get update
          sudo chmod o+x "$HOME"
          sudo ./install_deps.sh

      # The SBOM step fetches its own scanner at build time if the host has
      # none, at whatever version its installer serves. Putting a pinned one on
      # PATH first is what keeps the build's inputs pinned. The version is the
      # one the builder would have fetched; a submodule bump that moves it is a
      # failing host assertion rather than a silent drift.
      - name: Install syft
        env:
          SYFT_VERSION: 1.44.0
          SYFT_SHA256: 6f6cdcdc695721d91ce756e3b5bc3e3416599c464101f5e32e9c3f33054ee6d9
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_arm64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf syft.tar.gz -O syft > "$RUNNER_TEMP/bin/syft"
          chmod +x "$RUNNER_TEMP/bin/syft"
          "$RUNNER_TEMP/bin/syft" --version | grep -qw "${SYFT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install bundle tooling
        run: sudo apt-get install -y --no-install-recommends rauc squashfs-tools

      - name: Build the image
        run: make image PROFILE=reachy

      - name: Assert against the built image
        run: make test-image PROFILE=reachy

      # The update path, end to end, on the artefacts a release would ship. The
      # signing pair is generated inside the run and dies with it: no key of any
      # kind is stored, uploaded, or reachable from outside this job.
      - name: Round-trip an update bundle
        run: |
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=brenn-os ci throwaway" \
            -keyout "$keydir/signing" -out "$keydir/anchor" 2>/dev/null
          BRENN_BUNDLE_CERT="$keydir/anchor" \
          BRENN_BUNDLE_KEY="$keydir/signing" \
          BRENN_BUNDLE_KEYRING="$keydir/anchor" \
            make bundle PROFILE=reachy
          rauc info --keyring="$keydir/anchor" work/image-*/*.raucb

      # The SBOM is the one artefact worth keeping: the images are gigabytes and
      # the build is the source of truth for them, but what went into a build is
      # worth being able to look up afterwards.
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reachy
          path: work/image-*/*.sbom
          if-no-files-found: error

  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed outside the checkout: the tree scan below must see repo
      # content only, not the scanner's own ~30 MB of binary artifacts.
      #
      # The sha256 is the release's published checksum for this asset. Release
      # assets are mutable, so the version self-check alone proves nothing — a
      # swapped binary reports whatever version it likes and then writes the
      # report that decides this job's verdict. The hash is the real gate; the
      # version check stays as a secondary sanity line.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version | grep -qx "${GITLEAKS_VERSION}"

      # --exit-code 0 makes findings a reporting outcome, so a nonzero exit here
      # means the scanner itself malfunctioned.
      - name: Scan tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path "$RUNNER_TEMP/findings.json" \
            --no-banner \
            --exit-code 0 \
            --log-level error

      # `ephemeral-reference` is a diff-time rule: it fires on a line as it is
      # written, not on content that already exists. A whole-tree scan has no
      # diff context and would report every pre-existing instance as new.
      # Subtract it here or this job is red on a backlog it is not the gate for.
      - name: Report
        run: |
          count=$(jq '[.[] | select(.RuleID != "ephemeral-reference")] | length' "$RUNNER_TEMP/findings.json")
          if [ "$count" -ne 0 ]; then
            echo "::error::$count finding(s) in tree scan"
            jq -r '.[] | select(.RuleID != "ephemeral-reference")
                   | "\(.File):\(.StartLine): [\(.RuleID)] \(.Description)"' "$RUNNER_TEMP/findings.json"
            exit 1
          fi
          echo "clean (shared rules)"
