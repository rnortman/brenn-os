name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# All jobs only read the tree. Pinned here so a permissive repo-level default
# cannot silently hand a write-capable token to cached actions, the downloaded
# scanner, or anything `make check` executes.
permissions:
  contents: read

jobs:
  # Named for its role, not its contents. The required-status-check rule embeds
  # this string, so a rename to track what the gate currently runs would leave
  # the rule pointing at a job that no longer exists — and silently stop gating.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # The builder submodule is fetched so the layer-metadata lint runs for
      # real. `make check` skips that lint when the submodule is absent, which
      # is a convenience on a fresh clone and must never be CI's path.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # python3-debian: the builder's metadata linter parses deb822, and without
      # it the lint skips — a skipping gate is a green result that checked
      # nothing.
      #
      # rauc and squashfs-tools: the host lane packs and verifies an update
      # bundle of a few kilobytes on every push, which is the only cheap place
      # the signing path runs at all — the image lane's round trip is behind a
      # half-hour build. This is the tool that packs a bundle, not the one that
      # installs it: the version that matters on a device is pinned into the
      # image.
      - name: Install gate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-debian rauc squashfs-tools

      # ubuntu-latest preinstalls shellcheck, but its version drifts with the
      # runner image, so a tree that lints clean on a developer's machine can go
      # red in CI on a rule an older version emits (and vice versa). Pin it —
      # same discipline as the scrub job's scanner — so the gate is reproducible
      # against a version a developer can install. The sha256 is the real gate
      # (release assets are mutable); the version check is a secondary sanity
      # line.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf shellcheck.tar.xz -O "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" > "$RUNNER_TEMP/bin/shellcheck"
          chmod +x "$RUNNER_TEMP/bin/shellcheck"
          "$RUNNER_TEMP/bin/shellcheck" --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Ubuntu 24.04 does not refuse unprivileged user namespaces; it moves the
      # unshared process into a restricted AppArmor profile that cannot write
      # its own uid_map, which presents as EPERM from `unshare -r`. Relax that
      # policy for this job only. The assert below stays the authority: a
      # runner this step cannot relax is a red job, not a thinner lane.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The host lane's cases that install a provisioning generation need uid
      # 0, and take it from a user namespace rather than from the job. Without
      # one they are not run and the lane says so — a gate quietly checking
      # less than it reports. Asserted here so a runner policy that refuses
      # unprivileged namespaces is a red job rather than a thinner one.
      - name: Assert unprivileged user namespaces are available
        run: unshare -r true

      # The gate's contents live in the root `check` target, not here, so the
      # whole thing is reproducible locally on a fresh clone. `check` skips the
      # lint when shellcheck is absent; the step above is what makes that
      # impossible here.
      - run: make check

  # Whether there is anything for the image lane to do. Building an image takes
  # tens of minutes on a runner, so a pull request that cannot affect one does
  # not start a build; anything landing on the default branch does, because that
  # is the tree releases are cut from.
  image-scope:
    name: image-scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      # Full history: the decision is a diff against the base of the pull
      # request, which a shallow clone does not contain. Only a pull request
      # needs it — the step below answers a push without looking at the tree at
      # all, and cloning the whole history to not read it gets slower with every
      # commit that lands.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "not a pull request — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything the build reads: the image sources, the scripts that
          # drive it, the assertions made against it, the lanes themselves, and
          # the builder's own pinned commit.
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
            grep -E '^(image|scripts|tests|\.github)/|^(Makefile|rpi-image-gen|\.gitmodules)$' || true)
          if [ -n "$changed" ]; then
            echo "building — changed:"
            printf '%s\n' "$changed" | sed 's/^/  /'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the image build reads has changed"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Not a required status check until it has a record of being stable — a lane
  # that blocks merges before it is trusted gets routed around, which is worse
  # than not having it.
  image:
    name: image
    needs: image-scope
    if: needs.image-scope.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The rootfs is assembled in an unprivileged user namespace that must be
      # able to traverse into the runner's home directory.
      #
      # TODO(ci-container-toolchain): this installs whatever the runner's
      # archive serves today, which is the one input of this lane that is not
      # pinned. The container lane pins the image it builds in and the runtime
      # it executes through; only its podman comes from the runner's archive.
      - name: Install builder host dependencies
        working-directory: rpi-image-gen
        run: |
          sudo apt-get update
          sudo chmod o+x "$HOME"
          sudo ./install_deps.sh

      # The SBOM step fetches its own scanner at build time if the host has
      # none, at whatever version its installer serves. Putting a pinned one on
      # PATH first is what keeps the build's inputs pinned. The version is the
      # one the builder would have fetched; a submodule bump that moves it is a
      # failing host assertion rather than a silent drift.
      - name: Install syft
        env:
          SYFT_VERSION: 1.44.0
          SYFT_SHA256: 6f6cdcdc695721d91ce756e3b5bc3e3416599c464101f5e32e9c3f33054ee6d9
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_arm64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf syft.tar.gz -O syft > "$RUNNER_TEMP/bin/syft"
          chmod +x "$RUNNER_TEMP/bin/syft"
          "$RUNNER_TEMP/bin/syft" --version | grep -qw "${SYFT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install bundle tooling
        run: sudo apt-get install -y --no-install-recommends rauc squashfs-tools

      - name: Build the image
        run: make image PROFILE=reachy

      - name: Assert against the built image
        run: make test-image PROFILE=reachy

      # What this build produced, in a form that fits in an artifact: the
      # partition table, the image description's identity fields, and the
      # package set. The image itself is gigabytes and is never uploaded.
      - name: Record what the build produced
        run: scripts/image-manifest.sh emit --output "$RUNNER_TEMP/manifest-native.txt"

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-native
          path: ${{ runner.temp }}/manifest-native.txt
          if-no-files-found: error

      # The update path, end to end, on the artefacts a release would ship. The
      # signing pair is generated inside the run and dies with it: no key of any
      # kind is stored, uploaded, or reachable from outside this job.
      - name: Round-trip an update bundle
        run: |
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=brenn-os ci throwaway" \
            -keyout "$keydir/signing" -out "$keydir/anchor" 2>/dev/null
          BRENN_BUNDLE_CERT="$keydir/anchor" \
          BRENN_BUNDLE_KEY="$keydir/signing" \
          BRENN_BUNDLE_KEYRING="$keydir/anchor" \
            make bundle PROFILE=reachy
          rauc info --keyring="$keydir/anchor" work/image-*/*.raucb

      # The SBOM is the one artefact worth keeping: the images are gigabytes and
      # the build is the source of truth for them, but what went into a build is
      # worth being able to look up afterwards.
      #
      # The directory names carry a version component set at build time, so the
      # glob cannot spell the path out. `tests/host` verifies this glob against
      # the builder's declared artefact paths.
      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reachy
          path: work/chroot-*/*.sbom
          if-no-files-found: error

  # The other half of the image lane: the same build, driven through the pinned
  # container on a host the builder does not support. That is what a developer
  # workstation is, so this job is the only place outside one where the lane a
  # developer actually builds on runs at all.
  #
  # Slower than the native job by a wide margin — every binary in the target
  # root filesystem runs under emulation here — so the timeout is generous, and
  # this is not a required status check until it has a record of being stable.
  image-container:
    name: image-container
    needs: image-scope
    if: needs.image-scope.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # The runtime pin, written once: the step that installs it and the step
    # that asserts what podman resolved read the same two values, so a bump
    # cannot move one and leave the other asserting the version before it.
    # Quoted because an unquoted 1.20 is the number 1.2.
    env:
      CRUN_VERSION: "1.28"
      CRUN_SHA256: 2aa6b7024a9c9f153895c0d11ae233d3758f54844011c3a039e3e89048d01d42
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # podman and a subordinate id range run the container rootless; the qemu
      # packages give the host the aarch64 registration the container borrows;
      # mtools is what the image suite reads the vfat partitions with, and is
      # not on the runner. The builder's own dependencies are in the container
      # image and are not installed here — that is the whole point of the lane.
      - name: Install the container lane's host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap qemu-user-static binfmt-support
          sudo apt-get install -y --no-install-recommends mtools

      # The runtime podman hands a container to, pinned the way this repo pins
      # every other fetched tool: version, sha256, and a check that what runs is
      # what was pinned. Unpinned it is whatever pairing the runner image
      # happens to carry, and a podman new enough to write OCI spec v1.2
      # configs against a crun too old to parse one refuses to create a
      # container at all — which is how this lane went red without a line of
      # the tree changing.
      #
      # The drop-in is what makes the pin load-bearing: naming the runtime by
      # path leaves nothing to PATH search order, which podman does not consult
      # for its runtime anyway.
      - name: Install crun
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VERSION}/crun-${CRUN_VERSION}-linux-amd64"
          echo "${CRUN_SHA256}  crun" | sha256sum -c -
          chmod +x crun
          sudo install -m 0755 crun /usr/local/bin/crun
          mkdir -p "$HOME/.config/containers"
          cat > "$HOME/.config/containers/containers.conf" <<'CONF'
          [engine]
          runtime = "crun"

          [engine.runtimes]
          crun = ["/usr/local/bin/crun"]
          CONF

      # Rootless podman maps the container's root to the invoking user and
      # every other uid into a subordinate range, which the user has to own.
      # The runner image does not always allocate one, and podman's failure
      # without it names uid mapping rather than this.
      - name: Ensure the runner owns a subordinate id range
        run: |
          user=$(id -un)
          for f in /etc/subuid /etc/subgid; do
            grep -q "^${user}:" "$f" || echo "${user}:200000:65536" | sudo tee -a "$f" >/dev/null
          done
          podman system migrate

      # What this lane is actually running, recorded in every run's log and
      # asserted rather than assumed. The pin above rests on a diagnosis read
      # off an error string; these three lines are the observation that either
      # confirms it or contradicts it, and a runner change that routes podman
      # back to the distro runtime fails here instead of working by luck.
      - name: Report and assert the container toolchain
        run: |
          podman version
          distro=$(/usr/bin/crun --version 2>/dev/null | sed -n 's/^crun version //p' | head -n1)
          echo "distro crun: ${distro:-none}"
          resolved=$(podman info --format '{{.Host.OCIRuntime.Path}}')
          version=$(podman info --format '{{.Host.OCIRuntime.Version}}' |
            sed -n 's/^crun version //p' | head -n1)
          echo "podman resolved runtime: ${resolved} (crun ${version})"
          test "$resolved" = /usr/local/bin/crun
          test "$version" = "$CRUN_VERSION"
          # The pin answers a podman/crun spec-version mismatch, and crun has
          # parsed every OCI 1.x spec version since 1.14.3. A distro runtime
          # at or past that version means the red run had some other cause and
          # the diagnosis wants reopening — said out loud here rather than left
          # to be inferred from a lane that went green.
          if [ -n "$distro" ] &&
             [ "$(printf '%s\n%s\n' 1.14.3 "$distro" | sort -V | head -n1)" = 1.14.3 ]; then
            echo "::warning::distro crun ${distro} already parses current OCI specs — the spec-version diagnosis behind this pin does not hold"
          fi

      # The container carries no qemu of its own: arm64 binaries in the target
      # root filesystem run through the host's registration, and the F flag is
      # what makes that work from inside a container — it opens the interpreter
      # at registration time, so the interpreter need not exist in the
      # container's filesystem. Asserted before the build rather than
      # discovered hours into one.
      - name: Assert the host's aarch64 registration carries the F flag
        run: |
          reg=/proc/sys/fs/binfmt_misc/qemu-aarch64
          test -f "$reg"
          grep -qx enabled "$reg"
          grep -q '^flags:.*F' "$reg"

      - name: Build the image in the container
        env:
          BRENN_BUILD_CONTAINER: always
        run: make image PROFILE=reachy

      # Only the build is containerised; the assertions run on the host.
      - name: Assert against the built image
        run: make test-image PROFILE=reachy

      - name: Record what the build produced
        run: scripts/image-manifest.sh emit --output "$RUNNER_TEMP/manifest-container.txt"

      - name: Upload the manifest
        uses: actions/upload-artifact@v4
        with:
          name: manifest-container
          path: ${{ runner.temp }}/manifest-container.txt
          if-no-files-found: error

  # The claim the container lane exists to make: that a build on a host the
  # builder does not support is the same product as the release-shaped one. Both
  # jobs have to have finished, so this is a job of its own rather than a step
  # in either — and cheap, because it compares two text files.
  #
  # Manifest level first. Hardening to equality of the images themselves is
  # worth doing once the two lanes are observed to agree at this level, and not
  # before: an unexplained difference is a finding to understand, and a finding
  # is easier to read as one line of a manifest than as two differing hashes.
  image-identity:
    name: image-identity
    needs: [image, image-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: manifest-native
          path: manifests

      - uses: actions/download-artifact@v4
        with:
          name: manifest-container
          path: manifests

      - name: Compare the two lanes
        run: |
          scripts/image-manifest.sh compare \
            manifests/manifest-native.txt \
            manifests/manifest-container.txt

  scrub:
    name: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed outside the checkout: the tree scan below must see repo
      # content only, not the scanner's own ~30 MB of binary artifacts.
      #
      # The sha256 is the release's published checksum for this asset. Release
      # assets are mutable, so the version self-check alone proves nothing — a
      # swapped binary reports whatever version it likes and then writes the
      # report that decides this job's verdict. The hash is the real gate; the
      # version check stays as a secondary sanity line.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version | grep -qx "${GITLEAKS_VERSION}"

      # --exit-code 0 makes findings a reporting outcome, so a nonzero exit here
      # means the scanner itself malfunctioned.
      - name: Scan tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml \
            --report-format json \
            --report-path "$RUNNER_TEMP/findings.json" \
            --no-banner \
            --exit-code 0 \
            --log-level error

      # `ephemeral-reference` is a diff-time rule: it fires on a line as it is
      # written, not on content that already exists. A whole-tree scan has no
      # diff context and would report every pre-existing instance as new.
      # Subtract it here or this job is red on a backlog it is not the gate for.
      - name: Report
        run: |
          count=$(jq '[.[] | select(.RuleID != "ephemeral-reference")] | length' "$RUNNER_TEMP/findings.json")
          if [ "$count" -ne 0 ]; then
            echo "::error::$count finding(s) in tree scan"
            jq -r '.[] | select(.RuleID != "ephemeral-reference")
                   | "\(.File):\(.StartLine): [\(.RuleID)] \(.Description)"' "$RUNNER_TEMP/findings.json"
            exit 1
          fi
          echo "clean (shared rules)"
